<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Photo Converter</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  :root{
    --ink:#1a1d23;
    --paper:#f7f6f3;
    --panel:#ffffff;
    --line:#d8d5cd;
    --accent:#2f5d50;
    --accent-soft:#e4ede9;
    --warn:#b5451b;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Segoe UI", -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    padding:32px 24px 60px;
  }
  h1{
    text-align:center;
    font-size:22px;
    letter-spacing:.14em;
    font-weight:700;
    margin:0 0 28px;
    text-transform:uppercase;
  }
  .layout{
    display:grid;
    grid-template-columns:1fr 1.3fr;
    gap:24px;
    max-width:1160px;
    margin:0 auto;
  }
  @media (max-width:820px){
    .layout{grid-template-columns:1fr;}
  }
  .panel{
    background:var(--panel);
    border:2px solid var(--ink);
    border-radius:2px;
    height:560px;
    display:flex;
    flex-direction:column;
  }
  @media (max-width:820px){
    .panel{ height:460px; }
  }
  .panel-label{
    font-size:11px;
    letter-spacing:.06em;
    color:#6b6558;
    padding:14px 16px 0;
  }

  /* Dropzone */
  #dropzone{
    flex:1;
    min-height:0;
    margin:14px;
    border:2px dashed var(--line);
    border-radius:4px;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:24px;
    cursor:pointer;
    transition:border-color .15s, background .15s;
  }
  #dropzone.drag{
    border-color:var(--accent);
    background:var(--accent-soft);
  }
  #dropzone.has-file{
    border-style:solid;
  }
  .dz-inner{max-width:280px;}
  .dz-icon{font-size:34px;margin-bottom:10px;color:#9a9485;}
  .dz-text{font-size:14px;color:#55504a;line-height:1.5;}
  .dz-filename{
    margin-top:14px;
    font-family:var(--mono);
    font-size:12.5px;
    background:var(--accent-soft);
    color:var(--accent);
    padding:6px 10px;
    border-radius:3px;
    word-break:break-all;
  }
  input[type=file]{display:none;}

  .convert-row{
    display:flex;
    gap:10px;
    align-items:center;
    justify-content:center;
    padding:0 14px 14px;
    flex-wrap:wrap;
  }
  select, .btn{
    font-family:inherit;
    font-size:12.5px;
  }
  select{
    padding:6px 8px;
    border:1px solid var(--line);
    border-radius:3px;
    background:#fff;
  }
  .btn{
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    padding:8px 18px;
    border-radius:3px;
    cursor:pointer;
    letter-spacing:.03em;
  }
  .btn:disabled{
    opacity:.35;
    cursor:not-allowed;
  }
  .btn.secondary{
    background:#fff;
    color:var(--ink);
  }

  /* Results grid */
  .results-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px 16px 0;
    flex-wrap:wrap;
    gap:8px;
  }
  .results-actions{
    display:flex;
    gap:8px;
    font-size:12px;
  }
  .link-btn{
    background:none;
    border:none;
    color:var(--accent);
    text-decoration:underline;
    cursor:pointer;
    font-size:12px;
    padding:0;
    font-family:inherit;
  }
  .link-btn:disabled{
    color:#b6b2a8;
    cursor:not-allowed;
  }
  #grid{
    flex:1;
    min-height:0;
    margin:14px;
    border:1px solid var(--line);
    border-radius:4px;
    padding:16px;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(130px, 1fr));
    grid-auto-rows:min-content;
    gap:14px;
    align-content:start;
    overflow-y:auto;
  }
  #grid.empty{
    display:flex;
    align-items:center;
    justify-content:center;
    color:#9a9485;
    font-size:13px;
    text-align:center;
  }
  .thumb{
    position:relative;
    border:2px solid var(--line);
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    background:#fafaf8;
    transition:border-color .12s, box-shadow .12s;
  }
  .thumb:hover{border-color:#b8b2a4;}
  .thumb.selected{
    border-color:var(--accent);
    box-shadow:0 0 0 2px var(--accent-soft);
  }
  .thumb img{
    width:100%;
    display:block;
    aspect-ratio:3/4;
    object-fit:cover;
    background:#eee;
  }
  .thumb .check{
    position:absolute;
    top:6px;
    right:6px;
    width:18px;
    height:18px;
    border-radius:50%;
    border:2px solid #fff;
    background:rgba(0,0,0,.35);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    font-size:11px;
    line-height:1;
  }
  .thumb.selected .check{
    background:var(--accent);
  }
  .thumb .pgnum{
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    background:rgba(26,29,35,.72);
    color:#fff;
    font-size:10.5px;
    text-align:center;
    padding:3px 0;
    letter-spacing:.04em;
  }
  .thumb .zoom{
    position:absolute;
    top:6px;
    left:6px;
    width:22px;
    height:22px;
    border-radius:50%;
    border:none;
    background:rgba(0,0,0,.45);
    color:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    cursor:zoom-in;
    opacity:0;
    transition:opacity .12s, background .12s;
  }
  .thumb:hover .zoom{opacity:1;}
  .thumb .zoom:hover{background:var(--accent);}
  .thumb.new{
    animation:pop-in .25s ease-out;
  }
  @keyframes pop-in{
    from{ transform:scale(.9); opacity:0; }
    to{ transform:scale(1); opacity:1; }
  }

  /* Preview modal */
  #previewOverlay{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(20,18,15,.82);
    z-index:1000;
    align-items:center;
    justify-content:center;
    padding:40px 20px;
  }
  #previewOverlay.open{display:flex;}
  .preview-box{
    max-width:min(820px, 92vw);
    max-height:88vh;
    display:flex;
    flex-direction:column;
    align-items:center;
  }
  .preview-box img{
    max-width:100%;
    max-height:72vh;
    object-fit:contain;
    border:3px solid #fff;
    border-radius:3px;
    background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,.4);
  }
  .preview-meta{
    color:#f2efe9;
    font-size:12.5px;
    margin-top:14px;
    display:flex;
    align-items:center;
    gap:18px;
    letter-spacing:.03em;
  }
  .preview-meta button{
    font-family:inherit;
    font-size:16px;
    background:none;
    border:1px solid rgba(255,255,255,.4);
    color:#fff;
    width:32px;
    height:32px;
    border-radius:50%;
    cursor:pointer;
  }
  .preview-meta button:hover{background:rgba(255,255,255,.15);}
  .preview-meta button:disabled{opacity:.3; cursor:not-allowed;}
  #previewClose{
    position:absolute;
    top:18px;
    right:24px;
    background:none;
    border:none;
    color:#fff;
    font-size:26px;
    cursor:pointer;
    line-height:1;
  }

  .footer-row{
    max-width:1160px;
    margin:20px auto 0;
    display:flex;
    justify-content:flex-end;
  }
  #downloadBtn{
    padding:14px 30px;
    font-size:13px;
    font-weight:600;
    letter-spacing:.06em;
  }
  .status{
    font-size:12px;
    color:#6b6558;
    text-align:center;
    margin-top:10px;
  }
  .status.warn{color:var(--warn);}
</style>
</head>
<body>

<h1>PDF to Photo Converter</h1>

<div class="layout">
  <!-- LEFT: upload -->
  <div class="panel">
    <div class="panel-label">SOURCE PDF</div>
    <div id="dropzone">
      <div class="dz-inner">
        <div class="dz-icon">&#8615;</div>
        <div class="dz-text">Drag &amp; drop a PDF here, or click to browse</div>
        <div class="dz-filename" id="fileNameTag" style="display:none;"></div>
      </div>
    </div>
    <input type="file" id="fileInput" accept="application/pdf">
    <div class="convert-row">
      <select id="formatSelect">
        <option value="image/png">PNG</option>
        <option value="image/jpeg">JPEG</option>
      </select>
      <select id="scaleSelect">
        <option value="1.5">Standard (1.5x)</option>
        <option value="2" selected>High (2x)</option>
        <option value="3">Max (3x)</option>
      </select>
      <button class="btn" id="convertBtn" disabled>Convert to Photos</button>
    </div>
  </div>

  <!-- RIGHT: results -->
  <div class="panel">
    <div class="results-header">
      <div class="panel-label" style="padding:0;">CONVERTED PHOTOS</div>
      <div class="results-actions">
        <button class="link-btn" id="selectAllBtn" disabled>Select all</button>
        <button class="link-btn" id="clearSelBtn" disabled>Clear</button>
      </div>
    </div>
    <div id="grid" class="empty">Converted pages will appear here</div>
  </div>
</div>

<div class="footer-row">
  <button class="btn" id="downloadBtn" disabled>Download</button>
</div>
<div class="status" id="statusMsg"></div>

<div id="previewOverlay">
  <button id="previewClose" aria-label="Close preview">&times;</button>
  <div class="preview-box">
    <img id="previewImg" src="" alt="Page preview">
    <div class="preview-meta">
      <button id="prevPageBtn" aria-label="Previous page">&#8592;</button>
      <span id="previewLabel">Page 1</span>
      <button id="nextPageBtn" aria-label="Next page">&#8594;</button>
    </div>
  </div>
</div>

<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const dropzone = document.getElementById('dropzone');
const fileInput = document.getElementById('fileInput');
const fileNameTag = document.getElementById('fileNameTag');
const convertBtn = document.getElementById('convertBtn');
const grid = document.getElementById('grid');
const selectAllBtn = document.getElementById('selectAllBtn');
const clearSelBtn = document.getElementById('clearSelBtn');
const downloadBtn = document.getElementById('downloadBtn');
const statusMsg = document.getElementById('statusMsg');
const formatSelect = document.getElementById('formatSelect');
const scaleSelect = document.getElementById('scaleSelect');
const previewOverlay = document.getElementById('previewOverlay');
const previewImg = document.getElementById('previewImg');
const previewLabel = document.getElementById('previewLabel');
const previewClose = document.getElementById('previewClose');
const prevPageBtn = document.getElementById('prevPageBtn');
const nextPageBtn = document.getElementById('nextPageBtn');
let previewIndex = null; // index into `pages` array (0-based) currently shown

let currentFile = null;
let pages = []; // { blob, url, index, dataUrl }
let selected = new Set();

function setStatus(msg, warn=false){
  statusMsg.textContent = msg || '';
  statusMsg.className = 'status' + (warn ? ' warn' : '');
}

// Stop the browser from opening the dropped file anywhere outside the dropzone
['dragenter','dragover','drop'].forEach(evt=>{
  document.addEventListener(evt, e => e.preventDefault());
  window.addEventListener(evt, e => e.preventDefault());
});

// ---- Dropzone interactions ----
dropzone.addEventListener('click', () => fileInput.click());

['dragenter','dragover'].forEach(evt=>{
  dropzone.addEventListener(evt, e=>{
    e.preventDefault();
    e.stopPropagation();
    if(e.dataTransfer) e.dataTransfer.dropEffect = 'copy';
    dropzone.classList.add('drag');
  });
});
['dragleave','drop'].forEach(evt=>{
  dropzone.addEventListener(evt, e=>{
    e.preventDefault();
    e.stopPropagation();
    dropzone.classList.remove('drag');
  });
});
dropzone.addEventListener('drop', e=>{
  e.preventDefault();
  e.stopPropagation();
  const dt = e.dataTransfer;
  const file = dt && dt.files && dt.files[0];
  if(file) handleFile(file);
  else setStatus('Could not read the dropped file — try clicking to browse instead.', true);
});
fileInput.addEventListener('change', e=>{
  const file = e.target.files[0];
  if(file) handleFile(file);
});

function handleFile(file){
  if(file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')){
    setStatus('Please select a PDF file.', true);
    return;
  }
  currentFile = file;
  fileNameTag.textContent = file.name;
  fileNameTag.style.display = 'inline-block';
  dropzone.classList.add('has-file');
  convertBtn.disabled = false;
  setStatus('');
  resetResults();
}

function resetResults(){
  pages.forEach(p => URL.revokeObjectURL(p.url));
  pages = [];
  selected.clear();
  grid.innerHTML = 'Converted pages will appear here';
  grid.classList.add('empty');
  selectAllBtn.disabled = true;
  clearSelBtn.disabled = true;
  downloadBtn.disabled = true;
}

// ---- Conversion ----
convertBtn.addEventListener('click', async () => {
  if(!currentFile) return;
  convertBtn.disabled = true;
  convertBtn.textContent = 'Converting…';
  resetResults();

  const mime = formatSelect.value;
  const scale = parseFloat(scaleSelect.value);
  const ext = mime === 'image/png' ? 'png' : 'jpg';

  try{
    const arrayBuffer = await currentFile.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const total = pdf.numPages;

    for(let i = 1; i <= total; i++){
      setStatus(`Rendering page ${i} of ${total}…`);
      const page = await pdf.getPage(i);
      const viewport = page.getViewport({ scale });
      const canvas = document.createElement('canvas');
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      const ctx = canvas.getContext('2d');
      if(mime === 'image/jpeg'){
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0,0,canvas.width,canvas.height);
      }
      await page.render({ canvasContext: ctx, viewport }).promise;

      const blob = await new Promise(res => canvas.toBlob(res, mime, 0.92));
      const url = URL.createObjectURL(blob);
      const pageData = { index: i, blob, url, ext, name: `page-${String(i).padStart(3,'0')}.${ext}` };
      pages.push(pageData);
      addThumbToGrid(pageData);
    }

    setStatus(`Done — ${total} page${total>1?'s':''} converted.`);
  }catch(err){
    console.error(err);
    setStatus('Could not read that PDF. It may be corrupted or password-protected.', true);
  }finally{
    convertBtn.disabled = false;
    convertBtn.textContent = 'Convert to Photos';
  }
});

function addThumbToGrid(p){
  if(grid.classList.contains('empty')){
    grid.innerHTML = '';
    grid.classList.remove('empty');
  }
  const div = document.createElement('div');
  div.className = 'thumb new';
  div.dataset.index = p.index;
  div.innerHTML = `
    <img src="${p.url}" loading="lazy">
    <button class="zoom" aria-label="Preview page ${p.index}">&#128269;</button>
    <div class="check">✓</div>
    <div class="pgnum">Page ${p.index}</div>
  `;
  div.addEventListener('click', () => toggleSelect(p.index, div));
  div.querySelector('.zoom').addEventListener('click', (e) => {
    e.stopPropagation();
    openPreview(pages.findIndex(pg => pg.index === p.index));
  });
  grid.appendChild(div);

  selectAllBtn.disabled = false;
  clearSelBtn.disabled = false;
  downloadBtn.disabled = false;
  updateDownloadLabel();
}

// ---- Preview modal ----
function openPreview(idx){
  if(idx < 0 || idx >= pages.length) return;
  previewIndex = idx;
  const p = pages[idx];
  previewImg.src = p.url;
  previewLabel.textContent = `Page ${p.index} of ${pages.length}`;
  prevPageBtn.disabled = idx === 0;
  nextPageBtn.disabled = idx === pages.length - 1;
  previewOverlay.classList.add('open');
}
function closePreview(){
  previewOverlay.classList.remove('open');
  previewIndex = null;
}
previewClose.addEventListener('click', closePreview);
previewOverlay.addEventListener('click', (e) => {
  if(e.target === previewOverlay) closePreview();
});
prevPageBtn.addEventListener('click', () => openPreview(previewIndex - 1));
nextPageBtn.addEventListener('click', () => openPreview(previewIndex + 1));
document.addEventListener('keydown', (e) => {
  if(!previewOverlay.classList.contains('open')) return;
  if(e.key === 'Escape') closePreview();
  if(e.key === 'ArrowLeft') openPreview(previewIndex - 1);
  if(e.key === 'ArrowRight') openPreview(previewIndex + 1);
});

function toggleSelect(index, el){
  if(selected.has(index)){
    selected.delete(index);
    el.classList.remove('selected');
  }else{
    selected.add(index);
    el.classList.add('selected');
  }
  updateDownloadLabel();
}

selectAllBtn.addEventListener('click', () => {
  selected = new Set(pages.map(p => p.index));
  document.querySelectorAll('.thumb').forEach(el => el.classList.add('selected'));
  updateDownloadLabel();
});
clearSelBtn.addEventListener('click', () => {
  selected.clear();
  document.querySelectorAll('.thumb').forEach(el => el.classList.remove('selected'));
  updateDownloadLabel();
});

function updateDownloadLabel(){
  if(selected.size === 0){
    downloadBtn.textContent = pages.length ? `Download All (${pages.length})` : 'Download';
  }else if(selected.size === 1){
    downloadBtn.textContent = 'Download Selected (1)';
  }else{
    downloadBtn.textContent = `Download Selected (${selected.size})`;
  }
}

function triggerDownload(url, filename){
  try{
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  }catch(err){
    console.warn('Direct download blocked, opening in new tab instead.', err);
    window.open(url, '_blank', 'noopener');
  }
}

downloadBtn.addEventListener('click', async () => {
  if(pages.length === 0) return;
  const toDownload = selected.size > 0
    ? pages.filter(p => selected.has(p.index))
    : pages;

  if(toDownload.length === 1){
    const p = toDownload[0];
    triggerDownload(p.url, p.name);
    setStatus('If the download didn\'t start, right-click the opened image and choose "Save image as…".');
    return;
  }

  setStatus('Zipping photos…');
  downloadBtn.disabled = true;
  try{
    const zip = new JSZip();
    for(const p of toDownload){
      zip.file(p.name, p.blob);
    }
    const content = await zip.generateAsync({ type: 'blob' });
    const zipUrl = URL.createObjectURL(content);
    const baseName = currentFile ? currentFile.name.replace(/\.pdf$/i,'') : 'pages';
    triggerDownload(zipUrl, `${baseName}-photos.zip`);
    setStatus(`If it didn't download automatically, use the artifact's "Open in new tab" button and try again.`);
    setTimeout(() => URL.revokeObjectURL(zipUrl), 30000);
  }catch(err){
    console.error(err);
    setStatus('Zip failed — try downloading fewer photos at once.', true);
  }finally{
    downloadBtn.disabled = false;
  }
});
</script>

</body>
</html>
