<style>
/* Tokens come from Puppertino; declared on body so they follow .p-auto-dark-mode */
body{--page:var(--p-bg-grouped-primary,#f2f2f7);--card:var(--p-bg-grouped-secondary,#fff);--ink:var(--p-text-primary,rgba(0,0,0,.85));--ink2:var(--p-text-secondary,rgba(60,60,67,.6));--line:var(--p-separator,rgba(60,60,67,.29));--fill:var(--p-fill-tertiary,rgba(118,118,128,.12));--fill2:var(--p-ios-fill,rgba(120,120,128,.2));--acc:var(--p-control-accent,#0088ff);--ring:var(--p-focus-ring-color,rgba(0,136,255,.5));--red:var(--p-sys-red,#ff383c)}
*{box-sizing:border-box}
html{color-scheme:light dark}
body{margin:0;background:var(--page);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
main{max-width:1150px;margin:0 auto;padding:12px 16px calc(112px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);grid-template-areas:"pv sb" "tr sb" "ov sb"}
@media(max-width:768px){main{grid-template-columns:1fr;grid-template-areas:"pv" "tr" "ov" "sb"}}
.panel{background:var(--card);border-radius:14px;padding:12px 16px;min-width:0}
.mut{color:var(--ink2)}
#pv{grid-area:pv;padding:0;overflow:hidden}
#stage{position:relative;aspect-ratio:16/9;background:#000;container-type:inline-size;cursor:pointer;overflow:hidden}
#mh{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#8e8e93;font-size:15px}
#mh img,#mh video{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
#bgc{position:absolute;inset:0;width:100%;height:100%}
#ovl{z-index:10;position:absolute;top:2cqw;left:2cqw;max-width:80%;color:#fff;font:700 2.2cqw/.9 'Red Hat Display','Segoe UI',Arial,Helvetica,sans-serif;display:none}
#ovl div{width:fit-content;max-width:100%;box-sizing:border-box;background:#003F88;padding:.25cqw .5cqw;white-space:pre-wrap}
#ovl div.e{background:none;padding:0;height:2.48cqw}
#pb{z-index:3;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:0;padding:0;display:grid;place-items:center;color:#fff;font-size:26px;cursor:pointer;background:rgba(40,40,40,.45);-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);box-shadow:inset 0 0 0 .5px rgba(255,255,255,.35)}
#pb i{margin-left:3px}
#pb.hide{display:none}
#tc{z-index:3;position:absolute;left:12px;bottom:24px;color:#fff;font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;padding:2px 8px;border-radius:999px;background:rgba(40,40,40,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
#tr{grid-area:tr;display:flex;align-items:center;gap:12px;min-height:56px}

.dual{position:relative;height:28px;flex:1}
.dual .tr{position:absolute;top:11px;left:0;right:0;height:6px;background:var(--fill2);border-radius:3px}
.dual .fill{position:absolute;top:11px;height:6px;background:var(--acc);border-radius:3px}
.dual input{position:absolute;left:0;top:0;width:100%;height:28px;margin:0;background:none;pointer-events:none;-webkit-appearance:none;appearance:none}
.dual input::-webkit-slider-runnable-track{background:none}
.dual input::-moz-range-track{background:none}
.dual input::-webkit-slider-thumb{pointer-events:auto;-webkit-appearance:none;width:28px;height:20px;border-radius:10px;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.14),0 .5px 4px rgba(0,0,0,.14);cursor:pointer}
.dual input::-moz-range-thumb{pointer-events:auto;width:28px;height:20px;border-radius:10px;background:#fff;border:0;box-shadow:0 3px 8px rgba(0,0,0,.14),0 .5px 4px rgba(0,0,0,.14);cursor:pointer}
.dual input:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 4px var(--ring)}
#ov{grid-area:ov;display:grid;gap:12px;overflow:hidden}
.orow{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;min-width:0}
.orow>label.p-label{flex:0 0 132px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.orow .p-field{flex:1 1 140px;width:auto;min-width:0;max-width:100%;text-transform:uppercase}
.orow .p-field::placeholder{text-transform:none}
.orow textarea.p-field{height:auto;min-height:60px;padding-top:8px;padding-bottom:8px;line-height:1.3;resize:vertical;font-family:inherit}
.orow .hl{flex:none;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
@media(max-width:560px){.orow>label.p-label{flex-basis:100%}}
#sb{grid-area:sb;position:relative;min-height:300px;padding:0;overflow:hidden}
#sbwrap{position:absolute;inset:0;overflow:auto}
#sbwrap.over{box-shadow:inset 0 0 0 3px var(--acc)}
#sbhead{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:8px;padding:10px 12px 10px 16px;box-shadow:inset 0 -.67px 0 var(--p-material-chrome-separator,rgba(0,0,0,.05))}
#sbhead b{flex:1;font-size:17px;font-weight:600}
#empty{padding:44px 16px;text-align:center;color:var(--ink2);cursor:pointer;display:grid;gap:10px;justify-items:center;font-size:15px}
#empty i{font-size:40px;color:var(--fill2)}
#empty p{margin:0}
.card .ob{display:none;position:absolute;right:6px;bottom:6px;align-items:center;justify-content:center;padding:1px 6px;border-radius:999px;background:#003F88;color:#fff;font-size:11px;font-weight:700}
.card .ob.o{background:#FFD101;color:#000}
.card .ob.h{background:rgba(40,40,40,.7);color:#fff;overflow:hidden}
.card .ob.h::after{content:"";position:absolute;left:-2px;right:-2px;top:50%;height:2px;background:#fff;transform:rotate(-35deg)}
.card.hasov .ob{display:inline-flex}
#list{position:relative;display:flex;flex-wrap:wrap;align-content:flex-start;gap:12px;padding:16px}
.card{-webkit-user-select:none;user-select:none;width:136px;border-radius:12px;background:var(--fill);cursor:grab;position:relative;overflow:hidden;transition:box-shadow .15s}
.card.sel{box-shadow:0 0 0 3px var(--acc)}
.card.dragging{opacity:.4}
.card .t{position:relative;aspect-ratio:16/9;background:#000 center/contain no-repeat}
.card .bl{display:none;position:absolute;left:6px;bottom:6px;align-items:center;gap:3px;padding:1px 7px 1px 5px;border-radius:999px;background:#FFD101;color:#000;font-size:11px;font-weight:700}
.card.hasbl .bl{display:inline-flex}
.card .m{display:flex;justify-content:space-between;align-items:center;padding:4px 8px;font-size:12px;color:var(--ink2);font-variant-numeric:tabular-nums}
.card .n{position:absolute;top:6px;left:6px;background:rgba(40,40,40,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border-radius:999px;padding:0 8px;font-size:12px;font-weight:600}
.x{position:absolute;top:6px;right:6px;width:22px;height:22px;padding:0;display:grid;place-items:center;border-radius:50%;background:rgba(40,40,40,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:#fff;border:0;font-size:11px;cursor:pointer}
#ph{position:absolute;width:14px;margin-left:-7px;z-index:2;cursor:ew-resize;display:none;touch-action:none}
#ph::after{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--red)}
#ph::before{content:"";position:absolute;left:0;top:-4px;border:7px solid transparent;border-top-color:var(--red);border-bottom:0}
#ex{position:fixed;left:50%;bottom:calc(12px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:min(1122px,calc(100% - 24px));display:flex;align-items:center;gap:12px;z-index:20;padding:10px 12px;border-radius:26px;box-shadow:var(--p-glass-edge,0 0 0 .5px rgba(0,0,0,.12)),var(--p-shadow-alert,0 18px 48px rgba(0,0,0,.25))}
#fp{flex:0 1 140px;width:140px;min-width:0;text-transform:uppercase}
#fn{flex:1;min-width:0;text-transform:uppercase}
#pbar{display:none;position:relative;flex:1;min-width:0;height:44px;border-radius:10px;overflow:hidden;background:var(--fill)}
#dir{max-width:200px}
#dir span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#ex.busy #fp,#ex.busy #fn,#ex.busy #dir,#ex.busy #dirx{display:none!important}
#ex.busy #pbar{display:block}
#pfill{position:absolute;inset:0 auto 0 0;width:0;background:var(--acc);opacity:.35}
#pt{position:absolute;inset:0;display:flex;align-items:center;padding:0 14px;font-size:15px;white-space:nowrap;overflow:hidden}
#rg{position:absolute;inset:0;z-index:4;pointer-events:none}
.rb{position:absolute;border:2px solid var(--acc);border-radius:3px;cursor:move;pointer-events:auto;touch-action:none}
.rt{position:absolute;left:2px;top:2px;display:none;gap:4px}
.rb.sel .rt{display:flex}
.rt button{border:0;border-radius:6px;padding:3px 7px;font:600 11px system-ui,sans-serif;color:#fff;background:rgba(40,40,40,.7);cursor:pointer}
.rt button.on{background:var(--acc)}
.rh{position:absolute;right:2px;bottom:2px;width:16px;height:16px;border-radius:50%;background:var(--acc);cursor:se-resize}
#kfs{position:absolute;left:0;right:0;top:100%;height:8px;pointer-events:none}
#kfs i{position:absolute;top:1px;width:7px;height:7px;border-radius:2px;background:var(--acc);transform:translateX(-50%) rotate(45deg)}
#sk{position:absolute;left:0;right:0;bottom:0;height:20px;z-index:5;cursor:pointer;touch-action:none}
#sl{position:absolute;left:10px;right:10px;bottom:7px;height:4px;border-radius:3px;background:rgba(255,255,255,.35);transition:height .1s,bottom .1s}
#sk:hover #sl{height:7px;bottom:6px}
#sf{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:3px;background:var(--acc)}
#sf::after{content:"";position:absolute;right:-7px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.45)}
#sc b{position:absolute;top:-6px;height:3px;border-radius:2px;background:#FFD101}
#sc i{position:absolute;top:-1px;bottom:-1px;width:2px;margin-left:-1px;background:rgba(0,0,0,.55)}
</style>
</head>
<body class="p-type p-auto-dark-mode">
<main>
  <div class="panel" id="pv">
    <div id="stage">
      <div id="mh">Add media to begin</div>
      <div id="ovl"></div>
      <button id="pb" class="hide" aria-label="Play"><i class="ph-bold ph-play" aria-hidden="true"></i></button>
      <div id="tc"></div>
      <div id="rg"></div>
      <div id="sk"><div id="sl"><div id="sc"></div><div id="sf"></div></div></div>
    </div>
  </div>
  <div class="panel" id="tr"></div>
  <div class="panel" id="ov">
    <div class="orow"><label class="p-label" for="otext">Overlay text</label><textarea class="p-field p-field-touch p-field-touch-filled" id="otext" rows="2" placeholder="Courtesy of …"></textarea></div>
    <div class="orow"><label class="p-label" for="bs">Blur</label><button id="bad" class="p-button p-button-touch p-button-secondary" type="button" disabled title="Add a blur box to the clip at the playhead"><i class="ph-bold ph-selection-plus" aria-hidden="true"></i><span>Add box</span></button><input class="p-slider p-slider-touch" type="range" id="bs" min="2" max="40" step="1" value="14" style="flex:1 1 120px;--p-slider-fill:36%" aria-label="Blur strength"><span class="hl" id="bv">14px</span></div>
    <div class="orow"><label class="p-label" id="ocl" for="oc">Selected clip</label><textarea class="p-field p-field-touch p-field-touch-filled" id="oc" rows="2" placeholder="Override for this clip"></textarea><span class="hl"><label class="p-switch p-switch-touch" aria-label="Hide overlay on this clip"><input type="checkbox" id="och"><span></span></label>Hide</span></div>
  </div>
  <div class="panel" id="sb">
    <div id="sbwrap">
      <div id="sbhead" class="p-material-chrome"><b>Storyboard</b><button id="add" class="p-button p-button-touch p-button-secondary" type="button"><i class="ph-bold ph-plus" aria-hidden="true"></i><span>Add media</span></button><button id="rst" class="p-button p-button-touch p-button-default" type="button" title="Reload the page and start over (save folder is kept)"><i class="ph-bold ph-arrow-counter-clockwise" aria-hidden="true"></i><span>Reset all</span></button></div>
      <div id="empty"><i class="ph-bold ph-images" aria-hidden="true"></i><p>Drag &amp; drop images and videos here, or click to browse</p></div>
      <div id="list"></div>
      <input id="file" type="file" accept="image/*,video/*" multiple hidden>
    </div>
  </div>
</main>
<div id="ex" class="p-material-thick"><input type="text" id="fp" class="p-field p-field-touch p-field-touch-filled" value="" aria-label="Reporter" placeholder="Reporter"><input type="text" id="fn" class="p-field p-field-touch p-field-touch-filled" value="" aria-label="File name" placeholder="File name"><button type="button" id="dir" class="p-button p-button-touch p-button-secondary" title="Choose a save folder"><i class="ph-bold ph-folder-open" aria-hidden="true"></i><span id="dirn">Folder</span></button><button type="button" id="dirx" class="p-button p-button-touch p-button-borderless p-button-icon-only" aria-label="Use browser default download" title="Use browser default download" style="display:none"><i class="ph-bold ph-x" aria-hidden="true"></i></button><div id="pbar"><div id="pfill"></div><div id="pt">Ready</div></div><button class="p-button p-button-touch-large p-button-primary" id="exp" type="button" disabled><i class="ph-bold ph-export" aria-hidden="true"></i><span>Export MP4</span></button></div>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script>
const $=id=>document.getElementById(id);
const ROW=64,W=1280,H=720,FPS=30,SR=48000;
const clips=[],media={};
let sel=-1,uid=0,dragIdx=-1,dragIds=[],exporting=false,playing=false,gt=0,last=0,raf=0,curId=0,curIdx=-1;
const ov={text:'',dur:0};
let ms=new Set(),ancId=0;
const selClips=()=>clips.filter(x=>ms.has(x.id));
function fixMs(){
  const ids=new Set(clips.map(x=>x.id));ms=new Set([...ms].filter(id=>ids.has(id)));
  if(!clips.length){ms=new Set();return}
  if(!ms.size||!clips[sel]||!ms.has(clips[sel].id)){
    if(ms.size)sel=clips.findIndex(x=>ms.has(x.id));
    else{sel=Math.min(Math.max(sel,0),clips.length-1);ms.add(clips[sel].id)}
  }
}
function setSel(i){const c=clips[i];if(!c||(i===sel&&ms.has(c.id)))return;sel=i;ms=new Set([c.id]);ancId=c.id;markSel();buildTrim()}
const len=c=>c.kind==='image'?c.dur:c.end-c.start;
const fmt=s=>s.toFixed(1)+'s';
const total=()=>clips.reduce((a,c)=>a+len(c),0);
const startOf=i=>{let a=0;for(let k=0;k<i;k++)a+=len(clips[k]);return a};
function locate(t){let a=0;for(let i=0;i<clips.length;i++){const l=len(clips[i]);if(t<a+l||i===clips.length-1)return{i,a,off:Math.max(0,Math.min(l,t-a))};a+=l}return null}
const once=(el,ev)=>new Promise((res,rej)=>{el.addEventListener(ev,res,{once:true});el.addEventListener('error',rej,{once:true})});
async function loadVideo(url){const v=document.createElement('video');v.muted=true;v.preload='auto';v.playsInline=true;v.src=url;await once(v,'loadeddata');return v}
const tinyC=document.createElement('canvas');
function drawBg(ctx,src,w,h,TW,TH){
  const tw=Math.max(16,Math.round(TW/12)),th=Math.max(9,Math.round(tw*TH/TW));
  if(tinyC.width!==tw||tinyC.height!==th){tinyC.width=tw;tinyC.height=th}
  const t=tinyC.getContext('2d'),k=Math.max(tw/w,th/h);
  t.drawImage(src,(tw-w*k)/2,(th-h*k)/2,w*k,h*k);
  ctx.save();ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  if('filter' in ctx)ctx.filter='blur('+Math.round(TW/64)+'px)';
  ctx.drawImage(tinyC,-TW*.05,-TH*.05,TW*1.1,TH*1.1);ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.3)';ctx.fillRect(0,0,TW,TH);
}
const needBg=(w,h,TW,TH)=>Math.abs(w/h-TW/TH)>.01;
function drawFit(ctx,src,w,h,TW,TH){ctx.fillStyle='#000';ctx.fillRect(0,0,TW,TH);if(needBg(w,h,TW,TH))drawBg(ctx,src,w,h,TW,TH);const s=Math.min(TW/w,TH/h),dw=w*s,dh=h*s;ctx.drawImage(src,(TW-dw)/2,(TH-dh)/2,dw,dh)}
let mbp;const loadMB=()=>mbp||(mbp=import('https://cdn.jsdelivr.net/npm/mediabunny@1.62.0/dist/bundles/mediabunny.min.mjs'));

/* ---------- adding files ---------- */
const fileIn=$('file'),wrap=$('sbwrap');
$('rst').onclick=()=>location.reload();
$('add').onclick=()=>fileIn.click();
$('empty').onclick=()=>fileIn.click();
fileIn.onchange=()=>{addFiles(fileIn.files);fileIn.value=''};
addEventListener('dragover',e=>{if(e.dataTransfer.types.includes('Files')){e.preventDefault();wrap.classList.add('over')}});
addEventListener('dragleave',e=>{if(!e.relatedTarget)wrap.classList.remove('over')});
addEventListener('drop',e=>{wrap.classList.remove('over');if(e.dataTransfer.files.length){e.preventDefault();addFiles(e.dataTransfer.files)}});
async function addFiles(list){
  for(const f of list){
    const url=URL.createObjectURL(f);
    if(f.type.startsWith('image/')){
      let th=url;
      try{const im=await createImageBitmap(f);const cv=document.createElement('canvas');cv.width=160;cv.height=90;drawFit(cv.getContext('2d'),im,im.width,im.height,160,90);th=cv.toDataURL()}catch(e){}
      clips.push({id:++uid,regions:[],file:f,kind:'image',url,thumb:th,dur:5,start:0,end:5,total:5});
    }else if(f.type.startsWith('video/')){
      try{
        const v=await loadVideo(url);
        const cv=document.createElement('canvas');cv.width=160;cv.height=90;
        v.currentTime=Math.min(0.1,v.duration/2);await once(v,'seeked');
        drawFit(cv.getContext('2d'),v,v.videoWidth,v.videoHeight,160,90);
        clips.push({id:++uid,regions:[],file:f,kind:'video',url,thumb:cv.toDataURL(),start:0,end:v.duration,total:v.duration,dur:v.duration});
      }catch(e){alert('Could not read '+f.name)}
    }
  }
  if(sel<0&&clips.length){sel=0;gt=0}fixMs();
  renderList();buildTrim();if(clips.length)seek(gt);
}

/* ---------- storyboard ---------- */
let phDrag=false;
function dragSeek(e){
  const cards=[...$('list').children].slice(0,clips.length);if(!cards.length)return;
  let best=0,bd=1e12,fr=0;
  cards.forEach((cd,i)=>{const r=cd.getBoundingClientRect();
    const dx=e.clientX<r.left?r.left-e.clientX:e.clientX>r.right?e.clientX-r.right:0;
    const dy=e.clientY<r.top?r.top-e.clientY:e.clientY>r.bottom?e.clientY-r.bottom:0;
    const d=dx+dy*4;if(d<bd){bd=d;best=i;fr=Math.min(.999,Math.max(0,(e.clientX-r.left)/r.width))}});
  setSel(best);
  seek(startOf(best)+fr*len(clips[best]));
}
function renderList(){
  const L=$('list');L.innerHTML='';
  clips.forEach((c,i)=>{
    const d=document.createElement('div');
    d.className='card'+(ms.has(c.id)?' sel':'');d.draggable=true;d.title=c.file.name;
    d.innerHTML='<div class="t"><b class="bl" title="This clip has blur"><i class="ph-bold ph-eye-slash"></i><span></span></b><b class="ob"></b></div><span class="n">'+(i+1)+'</span><button class="x" title="Remove" aria-label="Remove clip"><i class="ph-bold ph-x"></i></button><div class="m"><span><i class="ph-bold '+(c.kind==='image'?'ph-image':'ph-film-strip')+'"></i></span><span></span></div>';
    d.querySelector('.t').style.backgroundImage='url("'+c.thumb+'")';
    d.onclick=e=>{const r=d.getBoundingClientRect();const fr=Math.min(.999,Math.max(0,(e.clientX-r.left)/r.width));
      if(e.shiftKey){const a=Math.max(0,clips.findIndex(x=>x.id===ancId)),lo=Math.min(a,i),hi=Math.max(a,i);ms=new Set(clips.slice(lo,hi+1).map(x=>x.id));sel=i;markSel();buildTrim();seek(startOf(i)+fr*len(c));return}

  const L=text.split('\n'),lh=25.3,px=6,py=3.2,mw=W*.8,x=26;let y=26;
  ctx.textBaseline='middle';
  L.forEach(l=>{
    if(!l.trim()){y+=lh+py*2;return}
    const w=Math.min(ctx.measureText(l).width,mw),h=lh+py*2;
    ctx.fillStyle='#003F88';ctx.fillRect(x,y,w+px*2,h);
    ctx.fillStyle='#fff';ctx.fillText(l,x+px,y+py+lh/2+1,mw);
    y+=h;
  });
}

/* ---------- save folder (File System Access API, handle kept in IndexedDB) ---------- */
const FSA='showDirectoryPicker' in window;
const idb=(m,...a)=>new Promise((res,rej)=>{const r=indexedDB.open('moviemaker',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onerror=()=>rej(r.error);r.onsuccess=()=>{const t=r.result.transaction('kv',m==='get'?'readonly':'readwrite'),q=t.objectStore('kv')[m](...a);t.oncomplete=()=>res(q.result);t.onerror=()=>rej(t.error)}});
let dirH=null;
function showDir(){$('dirn').textContent=dirH?dirH.name:'Folder';$('dirx').style.display=dirH?'':'none';$('dir').title=dirH?'Saving to '+dirH.name+' (click to change)':'Choose a save folder'}
$('dir').onclick=async()=>{try{const h=await showDirectoryPicker({id:'moviemaker',mode:'readwrite'});dirH=h;try{await idb('put',h,'dir')}catch(e){}showDir()}catch(e){if(e&&e.name!=='AbortError')alert('Could not use that folder. Pick a subfolder (system folders like Downloads itself are blocked).')}};
$('dirx').onclick=async()=>{dirH=null;try{await idb('delete','dir')}catch(e){}showDir()};
(async()=>{if(!FSA){$('dir').style.display='none';return}try{dirH=await idb('get','dir')||null}catch(e){}showDir()})();
async function uniqueName(dir,name){
  const base=name.replace(/\.mp4$/i,'');let n=name,i=1;
  for(;;){try{await dir.getFileHandle(n);i++;n=base+' ('+i+').mp4'}catch(e){return n}}
}

/* ---------- export ---------- */
const setP=(t,pct)=>{$('pt').textContent=t;if(pct!=null)$('pfill').style.width=pct+'%'};
$('exp').onclick=async()=>{
  let dirOK=false;
  if(dirH){try{const o={mode:'readwrite'};dirOK=(await dirH.queryPermission(o))==='granted'||(await dirH.requestPermission(o))==='granted'}catch(e){}}
  if(!window.VideoEncoder||!window.Mp4Muxer){alert('This browser lacks WebCodecs. Please use a recent Chrome, Edge or Safari.');return}
  exporting=true;stop();await readClip();const fnPf=$('fp').value.trim().toUpperCase(),fnTxt=((fnPf?fnPf+' - ':'')+($('fn').value.trim().toUpperCase()||clipTxt).slice(0,100));try{await document.fonts.load('700 28px "Red Hat Display"')}catch(e){}$('exp').disabled=true;$('ex').classList.add('busy');setP('Preparing…',0);
  try{
    const T=total(),hasAudio=!!window.AudioEncoder;
    const muxer=new Mp4Muxer.Muxer({target:new Mp4Muxer.ArrayBufferTarget(),fastStart:'in-memory',
      video:{codec:'avc',width:W,height:H},
      ...(hasAudio?{audio:{codec:'aac',sampleRate:SR,numberOfChannels:2}}:{})});
    const venc=new VideoEncoder({output:(c,m)=>muxer.addVideoChunk(c,m),error:e=>{throw e}});
    venc.configure({codec:'avc1.42001f',width:W,height:H,bitrate:5e6,framerate:FPS,hardwareAcceleration:'prefer-hardware'});
    const cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
    const cv2=document.createElement('canvas');cv2.width=W;cv2.height=H;const c2=cv2.getContext('2d');
    let frame=0,mode='',why='';const t0=performance.now(),totalFrames=Math.round(T*FPS);
    const push=async()=>{
      let src=cv;
      const tx=ovFor(frame/FPS);if(tx){c2.drawImage(cv,0,0);drawOv(c2,tx);src=cv2}
      const vf=new VideoFrame(src,{timestamp:Math.round(frame*1e6/FPS),duration:Math.round(1e6/FPS)});
      venc.encode(vf,{keyFrame:frame%60===0});vf.close();frame++;
      if(frame%15===0)setP('Encoding ['+mode+'] '+(frame/((performance.now()-t0)/1000)).toFixed(0)+' fps · '+Math.round(frame/totalFrames*100)+'%',frame/totalFrames*85);
      if(venc.encodeQueueSize>8)await new Promise(r=>venc.addEventListener('dequeue',r,{once:true}));
    };
    for(const c of clips){
      const n=Math.max(1,Math.round(len(c)*FPS));
      ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
      if(c.kind==='image'){
        mode='image';
        const im=await createImageBitmap(c.file);
        drawFit(ctx,im,im.width,im.height,W,H);applyBlur(ctx,c,0);
        for(let k=0;k<n;k++)await push();
      }else{
        let done=0;why='';
        try{
          const MB=await loadMB();
          const inp=new MB.Input({source:new MB.BlobSource(c.file),formats:MB.ALL_FORMATS});
          const trk=await inp.getPrimaryVideoTrack();
          if(!trk)why='no video track';
          else if(!await trk.canDecode())why='codec not decodable';
          else{
            mode='fast decode';
            const vw=trk.displayWidth,vh=trk.displayHeight,fs=Math.min(W/vw,H/vh),fw=Math.round(vw*fs),fh=Math.round(vh*fs);
            const sink=new MB.CanvasSink(trk,{width:fw,height:fh,fit:'fill'});
            const ts=Array.from({length:n},(_,k)=>c.start+k/FPS);
            let lastC=null;
            for await(const wc of sink.canvasesAtTimestamps(ts)){
              if(wc)lastC=wc.canvas;
              if(lastC){ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);if(needBg(fw,fh,W,H))drawBg(ctx,lastC,fw,fh,W,H);ctx.drawImage(lastC,(W-fw)/2,(H-fh)/2,fw,fh);applyBlur(ctx,c,ts[done])}
              await push();done++;
            }
          }
        }catch(e){why=String(e&&e.message||e);console.warn('Fast decode failed',e)}
        if(done<n){
          mode='seek fallback: '+why;
          const v=await loadVideo(c.url);
          for(let k=done;k<n;k++){
            v.currentTime=Math.min(c.start+k/FPS,v.duration);await once(v,'seeked');
            drawFit(ctx,v,v.videoWidth,v.videoHeight,W,H);applyBlur(ctx,c,c.start+k/FPS);await push();
          }
        }
      }
    }
    await venc.flush();venc.close();
    if(hasAudio){
      setP('Mixing audio…',88);
      const off=new OfflineAudioContext(2,Math.ceil(T*SR),SR);let at=0;
      for(const c of clips){
        if(c.kind==='video'){
          try{
            const buf=await new AudioContext().decodeAudioData(await c.file.arrayBuffer());
            const s=off.createBufferSource();s.buffer=buf;s.connect(off.destination);s.start(at,c.start,len(c));
          }catch(e){/* no audio track */}
        }
        at+=len(c);
      }
      const mix=await off.startRendering();
      setP('Encoding audio…',94);
      const aenc=new AudioEncoder({output:(c,m)=>muxer.addAudioChunk(c,m),error:e=>{throw e}});
      aenc.configure({codec:'mp4a.40.2',sampleRate:SR,numberOfChannels:2,bitrate:128000});
      const L=mix.getChannelData(0),R=mix.getChannelData(1),step=4800;
      for(let i=0;i<mix.length;i+=step){
        const nf=Math.min(step,mix.length-i),d=new Float32Array(nf*2);
        d.set(L.subarray(i,i+nf),0);d.set(R.subarray(i,i+nf),nf);
        const ad=new AudioData({format:'f32-planar',sampleRate:SR,numberOfFrames:nf,numberOfChannels:2,timestamp:Math.round(i*1e6/SR),data:d});
        aenc.encode(ad);ad.close();
        if(aenc.encodeQueueSize>20)await new Promise(r=>setTimeout(r,5));
      }
      await aenc.flush();aenc.close();
    }
    muxer.finalize();
    const blob=new Blob([muxer.target.buffer],{type:'video/mp4'});
    const name=(fnTxt.replace(/\.mp4$/i,'').replace(/[^\w\-. ]+/g,'_')||'movie')+'.mp4';
    setP('Saving '+name+' ('+(blob.size/1048576).toFixed(1)+' MB)…',98);
    let saved=false,where='';
    if(dirOK){try{const fn2=await uniqueName(dirH,name),fh=await dirH.getFileHandle(fn2,{create:true}),w=await fh.createWritable();await w.write(blob);await w.close();saved=true;where=' → '+dirH.name+'/'+fn2}catch(e){console.warn('Folder save failed, using normal download',e)}}
    try{
      const dl=!saved&&window.claude&&await claude.use('downloads');
      if(dl){await dl.save({filename:name,data:blob});saved=true}
    }catch(e){if(e&&e.code==='declined'){setP('Save cancelled',100);throw 0}}
    if(!saved){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
    setP('Done · '+(where?where.slice(3):name)+' · '+(blob.size/1048576).toFixed(1)+' MB',100);
  }catch(e){
    if(e!==0){console.error(e);setP('Export failed: '+(e&&e.message||e),0)}
  }
  exporting=false;$('exp').disabled=!clips.length;
  setTimeout(()=>{if(!exporting)$('ex').classList.remove('busy')},4000);
};
const typing=t=>t.tagName==='TEXTAREA'||(t.tagName==='INPUT'&&['text','number'].includes(t.type));
addEventListener('keydown',e=>{
  if(typing(e.target)||!clips.length)return;
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='a'){e.preventDefault();ms=new Set(clips.map(x=>x.id));markSel();buildTrim()}
  else if(e.key==='Escape'&&ms.size>1){ms=new Set([clips[sel].id]);markSel();buildTrim()}
});
addEventListener('keydown',e=>{if(e.code==='Space'&&!typing(e.target)){e.preventDefault();playing?stop():play()}});
addEventListener('keyup',e=>{if(e.code==='Space'&&!typing(e.target))e.preventDefault()});
renderList();buildTrim();
</script>
