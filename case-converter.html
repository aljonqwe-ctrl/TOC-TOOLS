<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Case Converter</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#dcf3ea;
    --text:#1f4a3d;
    --muted:#7fae9c;
    --accent:#ff6f91;
    --accent-soft:rgba(255,111,145,0.20);
    --gold:#f4a261;
    --gold-soft:rgba(244,162,97,0.22);
    --shadow-dark:#b9d9cb;
    --shadow-light:#f5fffb;
    --radius:20px;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:var(--bg);
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:44px 20px 60px;
  }

  header{
    text-align:center;
    margin-bottom:34px;
  }
  header h1{
    font-family:'Fredoka', sans-serif;
    font-weight:700;
    font-size:clamp(34px, 6vw, 52px);
    margin:0;
    color:var(--text);
    letter-spacing:0.5px;
  }
  header .sub{
    margin-top:8px;
    color:var(--muted);
    font-size:15px;
    font-weight:500;
  }
  header .badge{
    display:inline-block;
    margin-top:16px;
    padding:8px 18px;
    border-radius:999px;
    font-family:'Fredoka', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:0.4px;
    color:var(--accent);
    background:var(--bg);
    box-shadow: 5px 5px 10px var(--shadow-dark), -5px -5px 10px var(--shadow-light);
  }

  .card{
    background:var(--bg);
    border-radius:var(--radius);
    box-shadow: inset 9px 9px 16px var(--shadow-dark), inset -9px -9px 16px var(--shadow-light);
    transition:box-shadow .15s ease;
  }

  textarea{
    width:100%;
    min-height:220px;
    background:transparent;
    border:none;
    color:var(--text);
    font-family:'Space Grotesk', sans-serif;
    font-size:16px;
    padding:22px;
    resize:vertical;
    outline:none;
  }
  textarea::placeholder{color:var(--muted);}

  .input-wrap:focus-within{
    box-shadow: inset 9px 9px 16px var(--shadow-dark), inset -9px -9px 16px var(--shadow-light), 0 0 0 3px var(--accent-soft);
  }

  .stats{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:18px;
  }
  .stats .pill{
    font-size:12px;
    font-weight:500;
    color:var(--text);
    background:var(--bg);
    border-radius:999px;
    padding:7px 15px;
    box-shadow: 4px 4px 9px var(--shadow-dark), -4px -4px 9px var(--shadow-light);
  }
  .stats .pill b{
    font-weight:700;
    color:var(--accent);
  }

  .section-label{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.4px;
    color:var(--muted);
    margin:32px 4px 14px;
    text-transform:uppercase;
  }

  .btn-row{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
  }

  button{
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.2px;
    color:var(--text);
    padding:12px 20px;
    border-radius:999px;
    border:none;
    background:var(--bg);
    cursor:pointer;
    transition:box-shadow .12s ease, transform .12s ease, color .12s ease;
    box-shadow: 6px 6px 12px var(--shadow-dark), -6px -6px 12px var(--shadow-light);
  }
  button:hover{
    color:var(--accent);
  }
  button:active{
    box-shadow: inset 4px 4px 8px var(--shadow-dark), inset -4px -4px 8px var(--shadow-light);
  }

  button.primary{
    background:var(--accent);
    color:#ffffff;
    box-shadow: 6px 6px 14px rgba(255,111,145,0.35), -6px -6px 14px rgba(245,255,251,0.8);
  }
  button.primary:hover{ color:#ffffff; opacity:.92; }
  button.primary:active{
    box-shadow: inset 4px 4px 10px rgba(200,60,95,0.45), inset -3px -3px 8px rgba(255,255,255,0.35);
  }

  button.sky{
    color:#2563eb;
  }

  button.yellow{
    background:var(--gold);
    color:#4a2c0a;
    box-shadow: 6px 6px 14px rgba(244,162,97,0.4), -6px -6px 14px rgba(245,255,251,0.8);
  }
  button.yellow:hover{ color:#4a2c0a; opacity:.9; }
  button.yellow:active{
    box-shadow: inset 4px 4px 10px rgba(190,120,60,0.45), inset -3px -3px 8px rgba(255,255,255,0.35);
  }

  button.ghost{
    background:transparent;
    color:var(--muted);
    border:none;
    box-shadow:none;
  }
  button.ghost:hover{ box-shadow:none; color:var(--text); background:transparent; text-decoration:underline; text-underline-offset:3px; }
  button.ghost:active{ box-shadow:none; }

  .toast{
    position:fixed;
    bottom:24px;
    right:24px;
    font-family:'Fredoka', sans-serif;
    font-weight:600;
    font-size:13px;
    background:var(--bg);
    color:var(--text);
    padding:13px 22px;
    border-radius:14px;
    opacity:0;
    transform:translateY(10px);
    transition:all .25s ease;
    z-index:100;
    box-shadow: 6px 6px 14px var(--shadow-dark), -6px -6px 14px var(--shadow-light);
  }
  .toast.show{opacity:1; transform:translateY(0);}

  ::selection{background:var(--gold-soft); color:var(--text);}
</style>
</head>
<body>
<main>
  <header>
    <h1>Case Converter</h1>
    <div class="sub">clean up and reformat any text</div>
    <div class="badge">no install needed</div>
  </header>

  <div class="card input-wrap">
    <textarea id="input" placeholder="paste your text here..."></textarea>
  </div>

  <div class="stats">
    <span class="pill">chars <b id="charCount">0</b></span>
    <span class="pill">no-space <b id="charNoSpaceCount">0</b></span>
    <span class="pill">words <b id="wordCount">0</b></span>
    <span class="pill">sentences <b id="sentenceCount">0</b></span>
    <span class="pill">lines <b id="lineCount">0</b></span>
  </div>

  <div class="section-label">Case Transforms</div>
  <div class="btn-row">
    <button onclick="apply('upper')">UPPER CASE</button>
    <button onclick="apply('lower')">lower case</button>
    <button onclick="apply('sentence')">Sentence case</button>
    <button onclick="apply('title')">Title Case</button>
    <button onclick="apply('capitalized')">Capitalized Case</button>
    <button onclick="apply('alternating')">aLtErNaTiNg</button>
    <button onclick="apply('inverse')">iNVERSE</button>
  </div>

  <div class="section-label">Text Utilities</div>
  <div class="btn-row">
    <button class="sky" onclick="apply('removeExtraSpaces')">remove extra spaces</button>
    <button class="sky" onclick="apply('removeLineBreaks')">remove line breaks</button>
    <button class="sky" onclick="apply('trim')">trim lines</button>
    <button class="sky" onclick="apply('reverse')">reverse text</button>
  </div>

  <div class="section-label">Actions</div>
  <div class="btn-row">
    <button class="primary" onclick="copyText()">copy to clipboard</button>
    <button class="yellow" onclick="downloadText()">download .txt</button>
    <button class="ghost" onclick="clearText()">clear</button>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
const input = document.getElementById('input');

function updateStats(){
  const text = input.value;
  document.getElementById('charCount').textContent = text.length;
  document.getElementById('charNoSpaceCount').textContent = text.replace(/\s/g,'').length;
  document.getElementById('wordCount').textContent = (text.trim().match(/\S+/g) || []).length;
  document.getElementById('sentenceCount').textContent = (text.match(/[.!?]+(?=\s|$)/g) || []).length;
  document.getElementById('lineCount').textContent = text === '' ? 0 : text.split(/\n/).length;
}
input.addEventListener('input', updateStats);
updateStats();

function toTitleCase(str){
  const minor = new Set(['a','an','the','and','but','or','nor','for','so','yet','at','by','in','of','on','to','up','as','is']);
  const words = str.toLowerCase().split(/(\s+)/);
  let wordIndex = 0;
  const totalWords = str.trim().split(/\s+/).length;
  return words.map((w) => {
    if(/^\s+$/.test(w) || w === '') return w;
    const isFirst = wordIndex === 0;
    const isLast = wordIndex === totalWords - 1;
    wordIndex++;
    if(!isFirst && !isLast && minor.has(w)) return w;
    return w.charAt(0).toUpperCase() + w.slice(1);
  }).join('');
}

function apply(mode){
  let text = input.value;
  switch(mode){
    case 'upper':
      text = text.toUpperCase(); break;
    case 'lower':
      text = text.toLowerCase(); break;
    case 'sentence':
      text = text.toLowerCase().replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
      break;
    case 'title':
      text = toTitleCase(text); break;
    case 'capitalized':
      text = text.replace(/\b\w/g, c => c.toUpperCase()); break;
    case 'alternating':
      text = text.split('').map((c,i) => i % 2 === 0 ? c.toLowerCase() : c.toUpperCase()).join('');
      break;
    case 'inverse':
      text = text.split('').map(c => c === c.toUpperCase() ? c.toLowerCase() : c.toUpperCase()).join('');
      break;
    case 'removeExtraSpaces':
      text = text.replace(/[ \t]+/g,' ').replace(/ ?\n ?/g,'\n').trim();
      break;
    case 'removeLineBreaks':
      text = text.replace(/\r?\n+/g,' ').replace(/ +/g,' ').trim();
      break;
    case 'trim':
      text = text.split('\n').map(l => l.trim()).join('\n');
      break;
    case 'reverse':
      text = text.split('').reverse().join('');
      break;
  }
  input.value = text;
  updateStats();
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 1600);
}

function copyText(){
  navigator.clipboard.writeText(input.value).then(() => showToast('copied to clipboard'));
}

function downloadText(){
  const blob = new Blob([input.value], {type:'text/plain'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'converted-text.txt';
  a.click();
  URL.revokeObjectURL(url);
  showToast('downloading...');
}

function clearText(){
  input.value = '';
  updateStats();
}
</script>
</body>
</html>
